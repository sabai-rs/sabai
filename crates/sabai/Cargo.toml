[package]
name = "sabai"
description = "A batteries-included web framework for Rust, built for developer experience and fast compiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[features]
default = []
orm = ["dep:sabai-orm"]
mysql = ["orm", "sabai-orm/mysql"]
sqlite = ["orm", "sabai-orm/sqlite"]
auth = ["orm", "dep:sabai-auth"]
argon2 = ["auth", "sabai-auth/argon2"]
queue = ["dep:sabai-queue"]
full = ["orm", "mysql", "sqlite", "auth", "argon2", "queue"]

[dependencies]
sabai-core.workspace = true
sabai-macros.workspace = true
sabai-http.workspace = true
sabai-orm = { workspace = true, optional = true }
sabai-auth = { workspace = true, optional = true }
sabai-queue = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
http.workspace = true
pollster.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[[test]]
name = "it"
path = "../../tests/it/main.rs"

[lints]
workspace = true
