[package]
name = "blog"
description = "The Sabai example app: a blog that uses every feature as it lands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# `main.rs` and tests call the app's code `bootstrap::...`, like Laravel's `bootstrap/app.php`,
# so it reads the same in every app whatever its name.
[lib]
name = "bootstrap"

[dependencies]
sabai = { workspace = true, features = ["orm", "auth"] }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
sabai-testing = { workspace = true, features = ["orm"] }

[lints]
workspace = true
