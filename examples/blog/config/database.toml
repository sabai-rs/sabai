default = "${DB_CONNECTION:-sqlite}"

[connections.sqlite]
driver = "sqlite"
database = "${DB_DATABASE:-:memory:}"

[connections.mysql]
driver = "mysql"
host = "${DB_HOST:-127.0.0.1}"
port = "${DB_PORT:-3306}"
database = "${DB_DATABASE:-blog}"
username = "${DB_USERNAME:-sabai}"
password = "${DB_PASSWORD:-}"

[connections.report]
driver = "${REPORT_DB_CONNECTION:-sqlite}"
host = "${REPORT_DB_HOST:-127.0.0.1}"
port = "${REPORT_DB_PORT:-3307}"
database = "${REPORT_DB_DATABASE:-:memory:}"
username = "${REPORT_DB_USERNAME:-sabai}"
password = "${REPORT_DB_PASSWORD:-}"
