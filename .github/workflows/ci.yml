name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# An explicit bash shell adds `-o pipefail`, so a failing cargo before `| tee` fails the step.
defaults:
  run:
    shell: bash

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Test with default features
        run: cargo nextest run --workspace
      - name: Test with all features
        run: cargo t

  # Builds and tests a `sabai new` app against this commit's crates, so a broken template fails here.
  template:
    runs-on: ubuntu-latest
    env:
      # The new app shares the workspace's target folder, so rust-cache covers its dependencies too.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p sabai-cli
      - name: Create an app with sabai new
        working-directory: ${{ runner.temp }}
        run: |
          "$CARGO_TARGET_DIR/debug/sabai" new demo --sabai-path "$GITHUB_WORKSPACE"
      - name: Migrate, lint and test the app
        working-directory: ${{ runner.temp }}/demo
        run: |
          "$CARGO_TARGET_DIR/debug/sabai" migrate
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  # No rust-cache here: a cached build would time the cache, not a clean build.
  timings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo timings --all-features 2>&1 | tee build.log
      - name: Report build time
        run: |
          echo "### Clean build" >> "$GITHUB_STEP_SUMMARY"
          grep 'Finished' build.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-timings
          path: target/cargo-timings/cargo-timing.html

  llvm-lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-lines
      # Fails when a crate in compile-budgets.toml compiles to more LLVM lines than its budget.
      - name: Check compile budgets
        run: |
          mkdir -p target/llvm-lines
          over=""
          echo "| Crate | LLVM lines | Budget |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: | ---: |" >> "$GITHUB_STEP_SUMMARY"
          while read -r crate budget; do
            cargo llvm-lines --quiet -p "$crate" --lib > "target/llvm-lines/$crate.txt"
            lines=$(awk '/\(TOTAL\)/ { print $1 }' "target/llvm-lines/$crate.txt")
            echo "| $crate | $lines | $budget |" | tee -a "$GITHUB_STEP_SUMMARY"
            if (( lines > budget )); then
              over+="error: $crate is $((lines - budget)) lines over its budget of $budget; shrink it, or raise the budget in compile-budgets.toml and say why\n"
            fi
          done < <(awk -F ' *= *' '/^[a-z]/ { print $1, $2 }' compile-budgets.toml)
          printf "%b" "$over" >&2
          [[ -z "$over" ]]
      # Runs after a failed check too, so the summary shows which functions grew.
      - name: Report the biggest functions per crate
        if: always()
        run: |
          for report in target/llvm-lines/*.txt; do
            echo "### $(basename "$report" .txt)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -20 "$report" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
