[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/sabai-rs/sabai"

[workspace.dependencies]
sabai = { path = "crates/sabai", version = "0.0.0" }
sabai-core = { path = "crates/sabai-core", version = "0.0.0" }
sabai-macros = { path = "crates/sabai-macros", version = "0.0.0" }
sabai-http = { path = "crates/sabai-http", version = "0.0.0" }
sabai-testing = { path = "crates/sabai-testing", version = "0.0.0" }
sabai-orm = { path = "crates/sabai-orm", version = "0.0.0" }
sabai-auth = { path = "crates/sabai-auth", version = "0.0.0" }
sabai-queue = { path = "crates/sabai-queue", version = "0.0.0" }

argon2 = "0.6"
bcrypt = "0.19"
bytes = "1"
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
dotenvy = "0.15"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
matchit = "0.8"
percent-encoding = "2.3"
pollster = "0.4"
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
serde = "1"
serde_json = "1"
serde_urlencoded = "0.7"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "mysql", "sqlite"] }
syn = { version = "3", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time"] }
toml = { version = "0.9", default-features = false, features = ["std", "parse", "serde"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

# Password hashing is slow on purpose, and unoptimized it is ten times slower (a bcrypt hash
# takes a second), so logins and tests crawl in development. Optimizing just these crates costs
# little build time.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blowfish]
opt-level = 3
